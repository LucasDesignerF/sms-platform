<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Faça login na SMS Platform - Receba SMS online com números temporários">
    <meta name="theme-color" content="#111B21">
    
    <title>Login - SMS Platform</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://imgur.com/0JbrAxh.png">
    <link rel="apple-touch-icon" href="https://imgur.com/0JbrAxh.png">
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            DEFAULT: '#111B21',
                            400: '#111B21',
                            500: '#0E171F',
                        },
                        surface: {
                            DEFAULT: '#1E2A35',
                            200: '#1E2A35',
                        },
                        primary: {
                            DEFAULT: '#00A884',
                            600: '#00A884',
                            700: '#008A6A',
                        },
                        error: {
                            DEFAULT: '#E94560',
                        },
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                }
            }
        }
    </script>
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #111B21 0%, #0E171F 100%);
            min-height: 100vh;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1E2A35;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00A884;
            border-radius: 10px;
        }
        
        /* Glass effect for card */
        .glass-card {
            background: rgba(30, 42, 53, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 168, 132, 0.2);
        }
        
        /* Input focus effect */
        .input-focus:focus {
            border-color: #00A884;
            box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.1);
            outline: none;
        }
        
        /* Button hover effect */
        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 168, 132, 0.3);
        }
    </style>
</head>
<body class="antialiased">
    <!-- Navbar -->
    <nav class="bg-dark-500 border-b border-surface-200 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <a href="/" class="flex items-center space-x-3 group">
                    <div class="relative">
                        <i class='bx bx-message-square-dots text-3xl text-primary-600'></i>
                        <div class="absolute -bottom-1 -right-1 w-2 h-2 bg-primary-600 rounded-full animate-pulse"></div>
                    </div>
                    <span class="font-bold text-xl bg-gradient-to-r from-primary-600 to-primary-500 bg-clip-text text-transparent">
                        SMS<span class="text-white">Platform</span>
                    </span>
                </a>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="/" class="text-gray-300 hover:text-primary-400 transition">Início</a>
                    <a href="/register" class="gradient-primary px-5 py-2 rounded-lg font-medium flex items-center gap-2 hover:shadow-lg hover:shadow-primary-600/30 transition-all">
                        <i class='bx bx-user-plus'></i>
                        Criar Conta
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Login Form -->
    <div class="min-h-[calc(100vh-64px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full animate-fade-in">
            <div class="glass-card rounded-2xl shadow-2xl p-8">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-primary-600/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class='bx bx-message-square-dots text-4xl text-primary-600'></i>
                    </div>
                    <h2 class="text-3xl font-bold text-white mb-2">Bem-vindo de volta</h2>
                    <p class="text-gray-400">Acesse sua conta para continuar</p>
                </div>
                
                <!-- Error Message -->
                <div class="error-message" style="display: none;"></div>
                
                <form class="mt-8 space-y-6" method="POST">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                <i class='bx bx-user'></i> Usuário
                            </label>
                            <input type="text" name="username" required 
                                   class="w-full px-4 py-3 bg-dark-400 border border-surface-200 rounded-xl text-white placeholder-gray-500 focus:border-primary-600 focus:ring-2 focus:ring-primary-600/20 transition-all input-focus"
                                   placeholder="Digite seu usuário">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                <i class='bx bx-lock'></i> Senha
                            </label>
                            <input type="password" name="password" required 
                                   class="w-full px-4 py-3 bg-dark-400 border border-surface-200 rounded-xl text-white placeholder-gray-500 focus:border-primary-600 focus:ring-2 focus:ring-primary-600/20 transition-all input-focus"
                                   placeholder="Digite sua senha">
                        </div>
                    </div>
                    
                    <div>
                        <button type="submit" 
                                class="group relative w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl font-semibold text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all btn-hover">
                            <i class='bx bx-log-in text-xl'></i>
                            Entrar
                            <i class='bx bx-right-arrow-alt text-xl group-hover:translate-x-1 transition-transform'></i>
                        </button>
                    </div>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-gray-400 text-sm">
                        Não tem uma conta?
                        <a href="/register" class="text-primary-600 hover:text-primary-500 font-medium transition">Criar conta grátis</a>
                    </p>
                </div>
                
                <div class="mt-6 pt-6 border-t border-surface-200 text-center">
                    <a href="/" class="text-gray-500 hover:text-gray-400 text-sm transition flex items-center justify-center gap-1">
                        <i class='bx bx-arrow-back'></i>
                        Voltar para o início
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="bg-dark-500 border-t border-surface-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="text-center text-gray-500 text-sm">
                <p>&copy; 2025 SMS Platform - Números Temporários para Receber SMS</p>
                <p class="mt-1">
                    Desenvolvido com <i class='bx bx-heart text-error'></i> por 
                    <span class="text-primary-400">Nexus Platform</span> 
                    por <span class="text-primary-400">© LucasDesigner</span>
                </p>
            </div>
        </div>
    </footer>
    
    <script>
        // Mostrar mensagem de erro se existir
        {% if error %}
        (function() {
            const errorDiv = document.querySelector('.error-message');
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <div class="bg-error/20 border border-error rounded-xl p-4 mb-4 flex items-center gap-3">
                        <i class='bx bx-error-circle text-error text-xl'></i>
                        <span class="text-error">${'{{ error }}'.replace(/[{}]/g, '')}</span>
                    </div>
                `;
            }
        })();
        {% endif %}
        
        // Animação de entrada
        document.querySelector('.animate-fade-in').style.animation = 'fadeIn 0.5s ease-out';
    </script>
</body>
</html>
